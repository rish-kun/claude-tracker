[package]
name = "cctrack"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Track Claude Code usage across a team"

[lib]
name = "cctrack"
path = "src/lib.rs"

[[bin]]
name = "cctrack"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
gethostname = "1.1.0"
open = "5.4.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
mockito = "1.7.2"
tempfile = "3.27.0"

# A single small, self-contained binary: rustls (no OpenSSL), LTO, no symbols.
[profile.release]
lto = true
codegen-units = 1
strip = true
